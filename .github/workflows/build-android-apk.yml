name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p android-app/app/src/main/java/com/progresstracker/app
          mkdir -p android-app/app/src/main/res/values android-app/app/src/main/res/drawable
          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ProgressTracker"
          include(":app")
          EOF
          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.10.1' apply false
          }
          EOF
          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          org.gradle.caching=true
          android.useAndroidX=true
          EOF
          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.progresstracker.app'
              compileSdk 36
              defaultConfig {
                  applicationId 'com.progresstracker.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '1.1.0'
              }
          }
          EOF
          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="false" android:hardwareAccelerated="true"
                  android:icon="@drawable/ic_progress_tracker" android:label="Progress Tracker"
                  android:supportsRtl="true" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > android-app/app/src/main/java/com/progresstracker/app/MainActivity.java <<'EOF'
          package com.progresstracker.app;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;

          public final class MainActivity extends Activity {
              private static final String TRACKER_URL = "https://karthickanu.github.io/progress-tracker/";
              private static final int FILE_CHOOSER_REQUEST = 41;
              private WebView webView;
              private ProgressBar loading;
              private ValueCallback<Uri[]> pendingFileChooser;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(238, 242, 249));
                  getWindow().setNavigationBarColor(Color.rgb(238, 242, 249));
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(238, 242, 249));
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(238, 242, 249));
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(false);
                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);
                  loading = new ProgressBar(this, null, android.R.attr.progressBarStyleLarge);
                  FrameLayout.LayoutParams loadingLayout = new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.CENTER);
                  root.addView(webView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT));
                  root.addView(loading, loadingLayout);
                  setContentView(root);
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int progress) {
                          loading.setVisibility(progress < 100 ? View.VISIBLE : View.GONE);
                      }
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                              FileChooserParams params) {
                          if (pendingFileChooser != null) pendingFileChooser.onReceiveValue(null);
                          pendingFileChooser = callback;
                          try {
                              startActivityForResult(params.createIntent(), FILE_CHOOSER_REQUEST);
                              return true;
                          } catch (ActivityNotFoundException error) {
                              pendingFileChooser = null;
                              return false;
                          }
                      }
                  });
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleNavigation(request.getUrl());
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleNavigation(Uri.parse(url));
                      }
                  });
                  if (savedInstanceState == null) webView.loadUrl(TRACKER_URL);
                  else webView.restoreState(savedInstanceState);
              }

              private boolean handleNavigation(Uri uri) {
                  if ("karthickanu.github.io".equalsIgnoreCase(uri.getHost())) return false;
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (ActivityNotFoundException ignored) { }
                  return true;
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_CHOOSER_REQUEST || pendingFileChooser == null) return;
                  Uri[] results = resultCode == RESULT_OK
                      ? WebChromeClient.FileChooserParams.parseResult(resultCode, data) : null;
                  pendingFileChooser.onReceiveValue(results);
                  pendingFileChooser = null;
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  if (webView != null) webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (pendingFileChooser != null) pendingFileChooser.onReceiveValue(null);
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF
          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#596FE0</item>
                  <item name="android:statusBarColor">#EEF3FF</item>
                  <item name="android:navigationBarColor">#EEF3FF</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF
          cat > android-app/app/src/main/res/drawable/ic_progress_tracker.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#5F83E5" android:pathData="M0,10C0,4.48 4.48,0 10,0h28c5.52,0 10,4.48 10,10v28c0,5.52 -4.48,10 -10,10H10C4.48,48 0,43.52 0,38z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M15.2,19.2l1.7,1.8 3.2,-3.3 1.6,1.5 -4.8,5 -3.3,-3.4zM25,19h13v2h-13zM15.2,28.2l1.7,1.8 3.2,-3.3 1.6,1.5 -4.8,5 -3.3,-3.4zM25,28h13v2h-13zM15.2,37.2l1.7,1.8 3.2,-3.3 1.6,1.5 -4.8,5 -3.3,-3.4zM25,37h13v2h-13z" />
          </vector>
          EOF

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: progress-tracker-android-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
