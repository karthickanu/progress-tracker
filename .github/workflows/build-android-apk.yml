name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p android-app/app/src/main/java/com/progresstracker/app
          mkdir -p android-app/app/src/main/res/values android-app/app/src/main/res/drawable
          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ProgressTracker"
          include(":app")
          EOF
          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.10.1' apply false
          }
          EOF
          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          org.gradle.caching=true
          android.useAndroidX=true
          EOF
          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.progresstracker.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.progresstracker.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          dependencies { implementation 'androidx.browser:browser:1.10.0' }
          EOF
          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="false" android:icon="@drawable/ic_progress_tracker"
                  android:label="Progress Tracker" android:supportsRtl="true" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > android-app/app/src/main/java/com/progresstracker/app/MainActivity.java <<'EOF'
          package com.progresstracker.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import androidx.browser.customtabs.CustomTabsIntent;
          public final class MainActivity extends Activity {
              private static final Uri TRACKER_URL = Uri.parse("https://karthickanu.github.io/progress-tracker/");
              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  CustomTabsIntent tab = new CustomTabsIntent.Builder().setShowTitle(true).build();
                  try { tab.launchUrl(this, TRACKER_URL); }
                  catch (RuntimeException error) { startActivity(new Intent(Intent.ACTION_VIEW, TRACKER_URL)); }
                  finish();
              }
          }
          EOF
          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#596FE0</item>
                  <item name="android:statusBarColor">#EEF3FF</item>
                  <item name="android:navigationBarColor">#EEF3FF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF
          cat > android-app/app/src/main/res/drawable/ic_progress_tracker.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#5B74E8" android:pathData="M0,10C0,4.48 4.48,0 10,0h28c5.52,0 10,4.48 10,10v28c0,5.52 -4.48,10 -10,10H10C4.48,48 0,43.52 0,38z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M15,10h13l7,7v21H15c-1.1,0 -2,-0.9 -2,-2V12c0,-1.1 0.9,-2 2,-2zM27,12v7h7M18,24h13v2H18zM18,29h13v2H18zM18,34h9v2h-9z" />
          </vector>
          EOF

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: progress-tracker-android-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
